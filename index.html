/* ---------------- rendu ---------------- */
function renderNights(){ if(run.phase==='night') return renderNight(); if(run.phase==='quiz') return renderQuiz(); if(run.phase==='morning') return renderMorning(); if(run.phase==='shop') return renderGearShop(); return renderOver(); }
function tubeOf(D,i){ const N=run.n, tc=TUBEC[D.pr]||TUBEC.bio, notyet=D.arrive>N.clock, picked=N.picks.includes(i), el=N.sel?!eligible(N.sel,D):false;
  const cls=['tubeD',i===N.focus?'focus':'',picked?'pick':'',D.done?(D.out.kind==='ok'?'ok':'ko'):'',notyet?'notyet':'',N.sel&&!el&&!picked?'dim':'',N.sel&&el&&!picked?'can':''].join(' ');
  const rem=D.due!=null&&!D.done?D.due-N.clock:null;
  return `<button class="${cls}" data-act="focus" data-i="${i}"><span class="td-svg">${tubes([{c:tc.c,cap:tc.cap,lvl:D.done?4:18}])}</span>
    <span class="td-n">${D.pat.nm.split(' ')[0]}</span><span class="td-p">${PRE[D.pr]}</span>
    ${D.done?`<span class="td-st">${D.out.kind==='ok'?'✓':'✗'}</span>`:notyet?`<span class="td-t">${clockTxt(D.arrive)}</span>`:rem!=null?`<span class="td-u ${rem<60?'hot':''}">⏰ ${rem<0?'retard':durTxt(rem)}</span>`:''}

  const pist=h>=1&&D.played.length?`<div class="pistes"><div class="pz-h">🔎 Pistes restantes : <b>${E.cand.length}</b> / ${E.pool.length}${E.cand.length===1?' · <span class="gold">diagnostic prouvé, rends le dossier !</span>':''}</div>${h>=2?`<div class="pz-row">${E.pool.map(k=>`<span class="pz ${E.cand.includes(k)?'on':'off'}">${BACT[k].ras?'✅ ':''}${BACT[k].n}</span>`).join('')}</div>`:''}</div>`:'';
  const tags=D.played.filter(p=>!p.ill).map(p=>{ let lab,col; try{ [lab,col]=shortTag(p.id,BACT[D.bid],p.res); }catch(e){} if(!lab||BACT[D.bid].rv) { lab=p.res.d.split(/[:·,]/)[0].slice(0,26); col='#9AA6B0'; } return `<span class="dtag" style="--tc:${col||'#9AA6B0'}"><small>${CARDS[p.id].n}</small>${lab}</span>`; });
  const cap=sel?capOf(sel):0, anyArr=N.ds.some(x=>!x.done&&x.arrive>N.clock), noneNow=N.ds.every(x=>x.done||x.arrive>N.clock);
  app.innerHTML=`<div class="screen night">
    <div class="nhud"><div class="nh-n" data-x="hud:night">🌙 <b>Nuit ${N.num}</b><small>${MODES[run.mode].e} niv. ${modeLevel(run.mode==='all'?'micro':run.mode)} · ${AIDE().e} ${AIDE().n}</small><i class="nxp"><b style="width:${xpInfo(run.mode==='all'?'micro':run.mode).pct}%"></b></i></div>

      ${D.played.length?dSummary(D):(notyet?'':`<div class="rempty">🧪 Paillasse vide. ${h>=1?'Choisis un outil en bas : ce tube est coché tout seul. Touche d\'autres tubes pour les ajouter à la <b>série</b>, puis Lancer la série. Touche à nouveau le tube pour voir sa paillasse.':''}</div>`)}</div>
    <div class="nbar">${sel?`<div class="nb-sel">${(()=>{ const pt=N.pt||{}, used=[...new Set(N.picks.map(i=>pt[i]||sel))]; const dur=N.picks.length?serCost(N.picks.map(i=>pt[i]||sel)):serMin(sel); return `<b>${used.length>1?'Série mixte : '+used.map(u=>CARDS[u].n+' ×'+N.picks.filter(i=>(pt[i]||sel)===u).length).join(' + '):CARDS[sel].n}</b> · 🕐 ${durTxt(dur)} · ${N.picks.length}/${cap} ${GNAME[grpOf(sel)]}${capOf(sel)>1?`<br><small class="muted">Touche une autre carte « ${GNAME[grpOf(sel)]} » pour l'ajouter à la même série</small>`:''}`; })()}</div>

      :`${h>=3&&rec&&!D.done?`<div class="nb-hint">💡 Conseil : <b>${CARDS[rec].n}</b>, ${CARDS[rec].d.charAt(0).toLowerCase()+CARDS[rec].d.slice(1)}</div>`:h>=3&&!D.done&&!notyet&&E.cand.length===1&&D.played.length?`<div class="nb-hint">💡 Une seule piste : <b>rends le dossier</b> !</div>`:''}

  </div>`;
  if(!$('#modal').classList.contains('show')&&run.phase==='night'&&N.ds.every(x=>x.done)) setTimeout(endNight,300); }
function renderMorning(){ const N=run.n, R=N.res; setTimeout(()=>{ try{ showLevelUp(); }catch(_){} },900);
  app.innerHTML=`<div class="screen"><div class="morning"><div class="sun"></div><h1>☀️ 8 h · Fin de la nuit ${N.num}</h1>

const decorMode=()=>(run&&run.v===5&&run.mode)||pendingChap||'micro';
function drawPosteDecor(ctx,t,noBench){ const m=decorMode(), L=modeLevel(m);
  const plaque=(x,y,c)=>{ P(ctx,x,y,10,2,'#D8DEE4'); P(ctx,x+1,y-2,8,2,c); P(ctx,x+1,y-3,8,1,'rgba(255,255,255,.4)'); };
  const tube=(x,y,c,cap)=>{ P(ctx,x,y,2,8,c); P(ctx,x,y-2,2,2,cap); P(ctx,x,y,1,8,'rgba(255,255,255,.3)'); };
  const box=(x,y,w,h,c,scr)=>{ P(ctx,x,y,w,h,c); P(ctx,x,y,w,1,'rgba(255,255,255,.25)'); if(scr){ P(ctx,x+2,y+2,Math.min(12,w-4),6,'#0B2A1E'); const on=Math.sin(t*3+x)>-.6; P(ctx,x+3,y+3,Math.min(10,w-6),1,on?'#5CFFB0':'#1F5A44'); P(ctx,x+3,y+5,Math.min(7,w-6),1,'#2E9E6E'); } };
  /* plaque du labo (niveau) */
  P(ctx,8,68,40,12,'#0A0D18'); P(ctx,9,69,38,10,'#121A2A'); P(ctx,11,71,6,6,MODES[m].c); TXT(ctx,String(L),21,72,'#FFD166');
  if(m==='micro'){
    /* étagère de géloses : une par palier de niveau */
    const cols=['#7FB6E0','#B8323C','#E06A5A','#5A2A4A','#CFE3D2','#4C8A5A','#D97AA0','#3A8A5A','#E8D9B5','#F2E36B'];
    const n=Math.min(10,1+Math.floor(L/3)); for(let i=0;i<n;i++) plaque(108+(i%5)*11,48+Math.floor(i/5)*-6+30-30, cols[i]);
    if(noBench) return;
    const st=Math.min(6,1+Math.floor(L/4)); for(let i=0;i<st;i++) plaque(30,108-i*3,cols[i%cols.length]);
    if(L>=3){ P(ctx,120,96,6,2,'#2A2F38'); P(ctx,122,84,2,12,'#3A4654'); P(ctx,118,82,10,3,'#4A5562'); P(ctx,124,78,3,6,'#59636F'); P(ctx,116,98,14,2,'#2A2F38'); }
    if(L>=10){ P(ctx,60,100,22,4,'#5A4632'); for(let i=0;i<5;i++) P(ctx,62+i*4,96,2,4,'#E8E2D6'); }
    if(L>=19) box(136,92,22,14,'#D8DEE4',1);
    if(L>=28){ box(86,110,24,12,'#3A4654',1); P(ctx,88,108,20,2,'#5CFFB0'); }
  } else if(m==='hema'){
    box(148,44,38,40,'#E6E9EE',1); P(ctx,152,64,30,3,'#9AA6B0'); TXT(ctx,'NFS',160,72,'#2E9E6E');
    if(noBench) return;
    const n=Math.min(12,2+Math.floor(L/2)); P(ctx,26,104,4+n*4,4,'#3A4654'); for(let i=0;i<n;i++) tube(28+i*4,96,i%3===2?'#3A6ED8':'#B23A3A',i%3===2?'#3A6ED8':'#7B4FC9');
    if(L>=2){ P(ctx,120,96,6,2,'#2A2F38'); P(ctx,122,84,2,12,'#3A4654'); P(ctx,118,82,10,3,'#4A5562'); P(ctx,124,78,3,6,'#59636F'); }
    if(L>=3){ ELL(ctx,72,104,9,4,'#9AA6B0'); ELL(ctx,72,103,7,3,'#D8DEE4'); P(ctx,71,100+Math.round(Math.sin(t*20)),2,2,'#3A4654'); }
    if(L>=7){ P(ctx,90,108,18,8,'#F4F0E6'); for(let i=0;i<3;i++) ELL(ctx,94+i*5,112,2,2,['#E26AA0','#3A6ED8','#F2E36B'][i]); }
    if(L>=14) box(136,96,22,12,'#D8DEE4',1);

function colPick(r){ const pool=colPool(); if(!pool.length) return null;
  const w=pool.map(ck=>{ const c=meta.col[ck]; let x=1; if(!c) x=r===2?5:r===1?3:2; else { const l=colLv(ck); x=Math.max(.4,2.2-l*.18); if(c.miss) x+=Math.min(2,c.miss*.4); }
    const L=ckLvNeed(ck); if(r===2) x*=L>=12?2.5:.5; else if(r===1) x*=L>=6?1.8:.7; return x; });
  let s=w.reduce((a,b)=>a+b,0)*Math.random(); for(let i=0;i<pool.length;i++){ s-=w[i]; if(s<=0) return pool[i]; } return pool[pool.length-1]; }

let CS=null;
function colSession(ck,mult,isNew){ meta.col[ck]=meta.col[ck]||{xp:0,n:0}; const startLv=colLv(ck)||1;
  CS={ck,mult,startLv,startXp:meta.col[ck].xp,t0:performance.now(),dur:30000,ok:0,ko:0,combo:0,best:0,last:null,q:null,busy:false,gain:0};
  let el=document.getElementById('colS'); if(!el){ el=document.createElement('div'); el.id='colS'; document.body.appendChild(el); }
  el.innerHTML=`<div class="cs-wrap"><div class="cs-head"><div class="cs-card"></div><div class="cs-meta"><b>${ckName(ck)}</b><small class="cs-lvl"></small><div class="cs-bar"><i></i></div></div><div class="cs-combo"></div></div>
    <div class="cs-time"><i></i></div><div class="cs-q"></div></div>`;
  colHead(); colAsk(); clearInterval(CS.iv); CS.iv=setInterval(colTick,100); }
function colHead(){ const el=$('#colS'); if(!el||!CS) return; const l=colLv(CS.ck), x=meta.col[CS.ck].xp, a=CLV[l-1]||0, b=CLV[l]||a;
  el.querySelector('.cs-card').innerHTML=ccHTML(CS.ck,{w:92});
  el.querySelector('.cs-lvl').textContent=`Niveau ${l}/10 · ${TIERN[colTier(l)]}${l<10?` · ${x-a}/${b-a} XP`:' · max'}`;
  el.querySelector('.cs-bar i').style.width=(l>=10?100:Math.round((x-a)/Math.max(1,b-a)*100))+'%';
  el.querySelector('.cs-combo').innerHTML=CS.combo>=3?`🔥 ×${CS.combo>=10?3:CS.combo>=5?2:1.5}`:''; }
function colTick(){ if(!CS) return; const p=Math.max(0,1-(performance.now()-CS.t0)/CS.dur); const i=$('#colS .cs-time i'); if(i) i.style.transform=`scaleX(${p})`; if(p<=0&&!CS.busy) colEnd(); }
function colAsk(){ const lv=colLv(CS.ck)||1; const gens=colQuestions(CS.ck,lv); let q=null;
  for(let n=0;n<12&&!q;n++){ const g=rand(gens); const c=g&&g(); if(c&&(c.q+c.ans)!==CS.last) q=c; }
  if(!q){ for(const g of gens){ q=g(); if(q) break; } }
  CS.q=q; CS.last=q?(q.q+q.ans):null; const box=$('#colS .cs-q'); if(!box) return;
  if(!q){ box.innerHTML='<p class="gs-hint">Pas de question pour cette carte.</p>'; return; }
  box.innerHTML=`<div class="cs-qt"><small>${q.sub||ckName(CS.ck)}</small>${q.q}</div><div class="cs-opts ${q.long?'long':''}">${q.opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div>`;
  box.querySelectorAll('button').forEach(b=>b.onclick=ev=>colAnswer(+b.dataset.i,b,ev)); }
function colAnswer(i,btn,ev){ if(!CS||CS.busy) return; const q=CS.q, ok=q.opts[i]===q.ans, c=meta.col[CS.ck];
  const before=colLv(CS.ck);
  if(ok){ CS.ok++; CS.combo++; CS.best=Math.max(CS.best,CS.combo); const m=(CS.combo>=10?3:CS.combo>=5?2:CS.combo>=3?1.5:1)*CS.mult; const g=Math.round(6*m); c.xp+=g; CS.gain+=g; btn.classList.add('ok'); tone(520+Math.min(CS.combo,12)*40,.05,'square');
    const fx=document.createElement('div'); fx.className='cs-fx'; fx.textContent='+'+g; const r=btn.getBoundingClientRect(); fx.style.left=(r.left+r.width/2-16)+'px'; fx.style.top=(r.top-6)+'px'; document.body.appendChild(fx); setTimeout(()=>fx.remove(),800); }
  else { CS.ko++; CS.combo=0; c.xp=Math.max(CLV[Math.max(0,before-1)]||0,c.xp-3); c.miss=(c.miss||0)+1; btn.classList.add('ko'); tone(190,.12,'sawtooth');
    const all=btn.parentNode.querySelectorAll('button'); all.forEach(b=>{ if(q.opts[+b.dataset.i]===q.ans) b.classList.add('ok'); }); }
  const after=colLv(CS.ck); if(ok&&c.miss&&CS.combo>=3) c.miss=Math.max(0,c.miss-1);
  saveMeta(); colHead();
  if(after>before){ const t=document.createElement('div'); t.className='cs-lvup'; t.textContent=colTier(after)>colTier(before)?`✨ Carte ${TIERN[colTier(after)]} !`:`Niveau ${after} !`; document.body.appendChild(t); setTimeout(()=>t.remove(),1400); sfx('win'); }
  CS.busy=true; setTimeout(()=>{ if(!CS) return; CS.busy=false; if(performance.now()-CS.t0>=CS.dur) colEnd(); else colAsk(); },ok?230:1100); }
function colEnd(){ if(!CS) return; clearInterval(CS.iv); const S=CS; CS=null; const c=meta.col[S.ck]; c.n=(c.n||0)+1; const l=colLv(S.ck);
  const m=ckMode(S.ck), px=Math.min(25,S.ok+(l>S.startLv?5:0)); saveMeta();
  const el=$('#colS'); if(!el) return;
  el.innerHTML=`<div class="cs-wrap" style="justify-content:center"><div class="cs-end">${ccHTML(S.ck,{tierTag:1})}
    <h3 class="v18h" style="margin:8px 0 0;font-size:22px;color:#ffd166">${l>S.startLv?`Niveau ${S.startLv} → ${l} !`:'Temps écoulé !'}</h3>
    <div class="cs-stats"><div><b>${S.ok}</b><small>bonnes réponses</small></div><div><b>${S.best}</b><small>meilleure série</small></div><div><b>+${S.gain}</b><small>XP de carte</small></div></div>
    <p class="cs-next">${S.ko?`${S.ko} erreur${S.ko>1?'s':''} : cette carte reviendra plus souvent dans les bocaux. `:''}${colNextUnlock(S.ck,l)}<br><b style="color:#5fe39a">+${px} XP</b> pour ton poste ${MODES[m].e} ${MODES[m].n}.</p>
    <div class="cs-row"><button class="v18-btn ghost" data-ce="shelf">Étagères</button><button class="v18-btn" data-ce="again">↻ Rejouer</button><button class="v18-btn gold" data-ce="jar">🫙 Autre bocal</button></div></div></div>`;
  el.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{ const a=b.dataset.ce; el.remove(); if(a==='again') colSession(S.ck,1,false); else if(a==='jar'){ if(screen!=='coll') go('coll'); else renderColl(); setTimeout(()=>{ const j=document.querySelector('.jar'); if(j) j.click(); },200); } else go('coll'); setTimeout(()=>{ try{ showLevelUp(); }catch(e){} },400); });
  colAddXp(m,px); }

zgStag3=function(c,L,t,P,mood){ const o=ZG.st, by=L.by; const s=personSpr(o,(P==='in'||P==='out')?Math.floor(t*6)%4:Math.floor(t*1.6)%2,mood), sc=2, w=s.width*sc;

const GRAM34=[{k:'bgn',l:'E. COLI : BACILLES GRAM -'},{k:'amas',l:'STAPHYLOCOQUES : COQUES GRAM + EN AMAS'},{k:'chain',l:'STREPTOCOQUES : COQUES GRAM + EN CHAINETTES'},{k:'diplo',l:'PNEUMOCOQUE : DIPLOCOQUES GRAM +'},{k:'cgn',l:'NEISSERIA : DIPLOCOQUES GRAM -'},{k:'lev',l:'CANDIDA : LEVURES BOURGEONNANTES'},{k:'bgp',l:'BACILLES GRAM + SPORULES'}];

function rng34(seed){ let a=seed>>>0||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function field34(kind,r,seed){ return sprite('f34'+kind+r+'_'+seed,2*r+1,2*r+1,g=>{ const R=rng34(seed), cx=r, cy=r, inC=(x,y,m=2)=>Math.hypot(x-cx,y-cy)<r-m;
  const pts=(n,min)=>{ const out=[]; let tries=0; while(out.length<n&&tries++<n*40){ const x=Math.round(R()*2*r), y=Math.round(R()*2*r); if(!inC(x,y,min/2+2)) continue; if(out.some(([a,b])=>Math.hypot(a-x,b-y)<min)) continue; out.push([x,y]); } return out; };
  const gram=['bgn','amas','chain','diplo','cgn','lev','bgp'].includes(kind);
  PX.C(g,cx,cy,r,gram?'#f7eef2':'#f8ecef'); for(let i=0;i<r*3;i++){ const x=Math.round(R()*2*r), y=Math.round(R()*2*r); if(inC(x,y)) R_(g,x,y,1,1,gram?'#f0d9e3':'#f3dde4'); }
  const rbc=(x,y,rd,o={})=>{ PX.C(g,x,y,rd,o.edge||'#cf6f86'); PX.C(g,x,y,rd-1,o.body||'#e58aa0'); const p=o.pale!=null?o.pale:Math.max(1,rd-3); if(p>0) PX.C(g,x,y,p,o.ctr||'#f5c9d4'); };
  const pnn=(x,y,lobes=3)=>{ PX.C(g,x,y,7,'#e9cfe0'); PX.C(g,x,y,6,'#f3e1ec'); for(let i=0;i<lobes;i++){ const a=-2.2+i*(4.4/Math.max(1,lobes-1)); PX.C(g,Math.round(x+Math.cos(a)*3),Math.round(y+Math.sin(a)*2.5),2,'#6a3d9a'); } };
  const lym=(x,y)=>{ PX.C(g,x,y,5,'#9fb8ea'); PX.C(g,x,y,4,'#4f2f86'); R_(g,x-1,y-2,1,1,'#7a5bb4'); };
  const blast=(x,y)=>{ PX.C(g,x,y,9,'#7f9de0'); PX.C(g,x,y,8,'#94b0ea'); PX.C(g,x,y,7,'#7a55b6'); for(let i=0;i<9;i++) R_(g,x-5+Math.round(R()*10),y-5+Math.round(R()*10),1,1,'#946fcc'); PX.C(g,x-2,y-1,1,'#c9b6f2'); PX.C(g,x+2,y+2,1,'#c9b6f2'); };
  const plt=(x,y)=>{ R_(g,x,y,2,2,'#8e5bd6'); R_(g,x+1,y,1,1,'#b48be8'); };
  const rod=(x,y,a,col,len=5)=>{ for(let k=0;k<len;k++){ R_(g,Math.round(x+Math.cos(a)*k),Math.round(y+Math.sin(a)*k),2,2,col); } };

    pts(3,22).forEach(([x,y])=>{ PX.C(g,x,y,6,'#f1d3df'); PX.C(g,x-1,y,2,'#e07aa0'); PX.C(g,x+2,y+1,2,'#e07aa0'); });
    if(kind==='bgn') pts(26,5).forEach(([x,y])=>rod(x,y,R()*3.1,pk,4+Math.round(R()*2)));
    if(kind==='bgp') pts(16,7).forEach(([x,y])=>{ const a=R()*3.1; rod(x,y,a,pu,7); if(R()<.6){ R_(g,Math.round(x+Math.cos(a)*3),Math.round(y+Math.sin(a)*3),2,2,'#f7eef2'); } });
    if(kind==='amas') pts(7,13).forEach(([x,y])=>{ for(let i=0;i<8;i++) coc(x+Math.round((R()-.5)*7),y+Math.round((R()-.5)*7),pu); });
    if(kind==='chain') pts(6,14).forEach(([x,y])=>{ let a=R()*6.28; for(let i=0;i<7;i++){ coc(Math.round(x+Math.cos(a)*i*2.6),Math.round(y+Math.sin(a)*i*2.6),pu); a+=(R()-.5)*.5; } });

    const rows=Math.max(1,Math.floor((ph-12)/7)); for(let r=0;r<rows;r++){ const y=top+11+r*7; R_(c,px+4,y+2,Math.round(pw*.5),1,'#c7d0dc'); const ok=r<Math.min(rows,done%(rows+1)); R_(c,px+pw-9,y,5,5,ok?'#5fe3a0':'#e3e8ef'); if(ok) R_(c,px+pw-8,y+2,3,1,'#1b7552'); }
  }catch(e){} }; }
/* ===================== v37 · corrections trouvées en jouant ===================== */
/* la carte de nuit : toujours les points de temps (jamais une heure qui ne colle pas) + la phase, même après la présentation d'outils */
setInterval(()=>{ try{ const s=document.querySelector('#nightI .ni-s'); if(!s||s.dataset.f||!run||!run.n) return; s.dataset.f=1; const N=run.n;
  s.innerHTML=`${MODES[run.mode].e} ${MODES[run.mode].n} · ⏱ <b>${ptsTxt(N.end-N.clock)}</b> points de temps`;
  if(!document.querySelector('#nightI .ni-ph')){ const P=run.mode==='all'?{n:'Biologiste de garde'}:phaseOf(N.num); document.querySelector('#nightI .ni-t')?.insertAdjacentHTML('afterend',`<div class="ni-ph">${run.mode==='all'?'🧠 Mode Biologiste · aucune aide':P.n}${run.mode!=='all'&&(N.num===5||N.num===10)?' · l\'aide diminue':''}${N.num>12?' · nuit plus courte':''}</div>`); } }catch(e){} },150);
/* la toute première nuit d'un poste commence par un cas d'école */
const CLASSIC37={micro:['ecoli'],hema:['h_fer'],bio:['b_hypo','b_glyco']};
{ const _pc=pickCase; pickCase=function(pool,n,taken){ try{ if(n===1&&!taken.length&&run&&CLASSIC37[run.mode]&&!(meta.first37||{})[run.mode]){ const k=CLASSIC37[run.mode].find(x=>pool.includes(x)); if(k){ meta.first37=meta.first37||{}; meta.first37[run.mode]=1; saveMeta(); return k; } } }catch(e){} return _pc.apply(this,arguments); }; }
/* le premier conseil suit la démarche du labo (ex. ECBU : la cytologie d'abord), pas un calcul */
{ const _bn=bestNext; bestNext=function(D){ try{ if(D&&!D.done&&D.arrive<=run.n.clock&&!realPlayed(D).length){ const pool=((run.n&&run.n.cases)||[]).filter(k=>BACT[k].pr===D.pr), cnt={};
      pool.forEach(k=>{ const f=(BACT[k].path||[]).find(x=>x!=='clin'&&CARDS[x]); if(f) cnt[f]=(cnt[f]||0)+1; });
      const first=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).find(k=>nTools().includes(k)&&!eligible(k,D)&&prereqOk(CARDS[k],D.flags)); if(first) return first; } }catch(e){} return _bn.apply(this,arguments); }; }
/* la mission du matin parle de ce qu'on vient de voir cette nuit (si possible) */
{ const _gq=genQuiz; genQuiz=function(){ let best=null; try{ const N=run.n, words=new Set(); (N&&N.ds||[]).forEach(D=>{ words.add(PRN[D.pr]); words.add(BACT[D.bid].n.split(' ')[0]); (realPlayed(D)||[]).forEach(p=>words.add(CARDS[p.id].n)); });
    for(let i=0;i<10;i++){ const q=_gq.apply(this,arguments); if(!q) continue; const txt=JSON.stringify(q); if([...words].some(w=>w&&txt.includes(w))) return q; if(!best) best=q; } }catch(e){} return best||_gq.apply(this,arguments); }; }
/* le record affiché = ton meilleur score AVANT cette garde (sinon on « bat » son propre record de la veille) */
{ const _sn=startNights; startNights=function(m){ const rm=recOf(m); const r=_sn.apply(this,arguments); try{ run.recMode=rm; if(run.n) run.n.prevBest=rm; }catch(e){} return r; }; }
{ const _nn=newNight; newNight=function(){ const r=_nn.apply(this,arguments); try{ if(run.recMode!=null) run.n.prevBest=run.recMode; }catch(e){} return r; }; }
/* écran de fin : le vrai record du poste */
{ const _ro=renderOver; renderOver=function(){ _ro.apply(this,arguments); try{ const p=[...document.querySelectorAll('.title-wrap.over p.center.muted')].find(x=>/Record/.test(x.textContent)); const r=recOf(run.mode), n=run.overNights||0, before=run.recMode||0;
    if(p) p.innerHTML=n>before&&n>0?`<b class="gold">🏆 Nouveau record !</b> (avant : ${before} nuit${before>1?'s':''}) · ${run.stats.ok} dossier${run.stats.ok>1?'s':''} juste${run.stats.ok>1?'s':''}`:`Record : <b class="gold">${r} nuit${r>1?'s':''}</b> · encore ${Math.max(1,r-n+1)} pour le battre · ${run.stats.ok} dossier${run.stats.ok>1?'s':''} juste${run.stats.ok>1?'s':''}`; }catch(e){} }; }
/* la barre « Lancer » sort de l'écran du jeu : posée directement sur la page, rien ne peut la couper */
const VERSION37='v31.3';
{ const _rn=renderNight; renderNight=function(){ _rn.apply(this,arguments); try{ document.getElementById('g19fix')?.remove(); const g=document.querySelector('.n20 .g19'); if(!g) return;
    const w=document.createElement('div'); w.id='g19fix'; w.className='g19 g19fix'; w.innerHTML=g.innerHTML; g.remove(); document.body.appendChild(w); document.querySelector('.n20')?.classList.add('hasg'); }catch(e){ console.error(e); } }; }
{ const _r=render; render=function(){ const r=_r.apply(this,arguments); try{ if(!(screen==='game'&&run&&run.phase==='night'&&(run.n.plan||[]).length)) document.getElementById('g19fix')?.remove(); }catch(e){ document.getElementById('g19fix')?.remove(); } return r; }; }
{ const _rt=renderTitle; renderTitle=function(){ _rt.apply(this,arguments); try{ document.querySelector('.hall21,.screen')?.insertAdjacentHTML('beforeend',`<span class="ver37">${VERSION37}</span>`); }catch(e){} }; }

try{ if(screen==='title') render(); }catch(e){}
